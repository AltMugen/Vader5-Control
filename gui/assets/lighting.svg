<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 90 600 430" role="img" aria-labelledby="vc-pad-title vc-pad-desc">
          <title id="vc-pad-title">Предпросмотр подсветки Vader 5 Pro</title><desc id="vc-pad-desc">Упрощённый контур контроллера. Десять RGB-каналов образуют полоску на нижнем торце.</desc>
          <defs>
            <linearGradient id="vc-body-shading" x1="0" y1="0" x2="0.4" y2="1"><stop stop-color="#242833"/><stop offset=".55" stop-color="#1b1e26"/><stop offset="1" stop-color="#151922"/></linearGradient>
            <radialGradient id="vc-stick-shading"><stop stop-color="#353c49"/><stop offset="1" stop-color="#20252f"/></radialGradient>
            <filter id="led-glow" filterUnits="userSpaceOnUse" x="165" y="350" width="390" height="100"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
