          <path class="vc-contour" style="stroke-width:5;opacity:.25" d="M239 136 L360 239 L481 136"/>
          <g class="vc-input-detail">
          <!-- Logo/home key is positioned above Select and Start. -->
          <path d="M337 146 L360 157 L383 146 L370 169 L360 190 L350 169 Z M351 158 L357 161 L357 179 L349 169 Z M369 158 L363 161 L363 179 L371 169 Z" fill="#b4bccb" fill-rule="evenodd" data-key="home"/>
          <g transform="rotate(42 278 186)" data-key="select"><rect class="vc-key" x="255" y="174" width="46" height="23" rx="11"/><circle cx="278" cy="185" r="4" fill="none" stroke="#8992a2" stroke-width="2"/></g>
          <g transform="rotate(-42 442 186)" data-key="start"><rect class="vc-key" x="419" y="174" width="46" height="23" rx="11"/><path d="M434 181 H450 M434 186 H450 M434 191 H450" stroke="#8992a2" stroke-width="2"/></g>
          <!-- Offset sticks and grouped direction keys from the reference. -->
          <circle cx="205" cy="240" r="43" fill="none" stroke="#9e8655" stroke-width="5" opacity=".7"/><circle cx="205" cy="240" r="34" fill="url(#vc-overview-stick-shading)" stroke="#515a69" stroke-width="2"/><circle cx="205" cy="240" r="18" class="vc-key" data-key="ls"/><text x="205" y="240" style="font-size:17px">LS</text>
<g transform="translate(0 -24)">          <circle cx="439" cy="326" r="43" fill="none" stroke="#9e8655" stroke-width="5" opacity=".7"/><circle cx="439" cy="326" r="34" fill="url(#vc-overview-stick-shading)" stroke="#515a69" stroke-width="2"/><circle cx="439" cy="326" r="18" class="vc-key" data-key="rs"/><text x="439" y="326" style="font-size:17px">RS</text></g>
<g transform="translate(0 -24)">          <circle cx="285" cy="289" r="17" class="vc-key" data-key="up"/><text x="285" y="289">↑</text><circle cx="252" cy="322" r="17" class="vc-key" data-key="left"/><text x="252" y="322">←</text><circle cx="318" cy="322" r="17" class="vc-key" data-key="right"/><text x="318" y="322">→</text><circle cx="285" cy="355" r="17" class="vc-key" data-key="down"/><text x="285" y="355">↓</text></g>
          <circle cx="511" cy="218" r="17" class="vc-key" data-key="y"/><text x="511" y="218">Y</text><circle cx="477" cy="254" r="17" class="vc-key" data-key="x"/><text x="477" y="254">X</text><circle cx="548" cy="254" r="17" class="vc-key" data-key="b"/><text x="548" y="254">B</text><circle cx="511" cy="290" r="17" class="vc-key" data-key="a"/><text x="511" y="290">A</text>
          <circle cx="562" cy="318" r="17" class="vc-key" data-key="z"/><text x="562" y="318">Z</text><circle cx="528" cy="353" r="17" class="vc-key" data-key="c"/><text x="528" y="353">C</text>
          </g>
