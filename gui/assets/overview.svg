<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="vc-overview-pad-title vc-overview-pad-desc">
          <title id="vc-overview-pad-title">Flydigi Vader 5 Pro</title><desc id="vc-overview-pad-desc">Схема по предоставленному изображению: плечевые LT, LM, LB и RM, RT, RB, левый стик вверху, правый ниже, ABXY справа, Z справа над C. Десять RGB-каналов образуют полоску на нижнем торце. Задние M1–M4 вынесены под корпус.</desc>
          <defs>
            <linearGradient id="vc-overview-body-shading" x1="0" y1="0" x2="0.4" y2="1"><stop stop-color="#242833"/><stop offset=".55" stop-color="#1b1e26"/><stop offset="1" stop-color="#151922"/></linearGradient>
            <radialGradient id="vc-overview-stick-shading"><stop stop-color="#353c49"/><stop offset="1" stop-color="#20252f"/></radialGradient>
            <filter id="led-glow" filterUnits="userSpaceOnUse" x="165" y="350" width="390" height="100"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <g class="vc-input-detail">
          <!-- Shoulder outlines follow the supplied front schematic. -->
          <path class="vc-key" d="M66 67 Q69 24 89 16 Q107 15 116 58 Z" data-key="lt"/><text x="91" y="43" class="vc-label">LT</text>
          <path class="vc-key" d="M130 28 H188 L199 64 H132 Z" data-key="lm"/><text x="163" y="47" class="vc-label">LM</text>
          <path class="vc-key" d="M70 84 L115 73 H171 V109 H111 Q82 104 70 84 Z" data-key="lb"/><text x="130" y="93" class="vc-label">LB</text>
          <path class="vc-key" d="M654 67 Q651 24 631 16 Q613 15 604 58 Z" data-key="rt"/><text x="629" y="43" class="vc-label">RT</text>
          <path class="vc-key" d="M590 28 H532 L521 64 H588 Z" data-key="rm"/><text x="557" y="47" class="vc-label">RM</text>
          <path class="vc-key" d="M650 84 L605 73 H549 V109 H609 Q638 104 650 84 Z" data-key="rb"/><text x="590" y="93" class="vc-label">RB</text>
          </g>
          <path class="vc-outline" d="M162 157 Q176 119 232 109 Q247 107 266 120 M454 120 Q473 107 488 109 Q544 119 558 157"/><!-- Rounded grip silhouette, raised centre and bottom recess. -->
          <path class="vc-outline" style="fill:url(#vc-overview-body-shading)" d="M177 146 Q218 119 267 120 H453 Q502 119 543 146 Q577 174 595 218 Q638 321 646 397 Q653 465 615 490 Q594 496 577 477 L512 402 Q497 378 467 378 H253 Q223 378 208 402 L143 477 Q126 496 105 490 Q67 465 74 397 Q82 321 125 218 Q143 174 177 146 Z"/>
