          </g>
        <g class="vc-input-detail"><circle class="vc-key" data-key="fn" cx="389" cy="557" r="15"/><text x="389" y="557" style="font-size:17px">FN</text><rect class="vc-key" data-key="turbo" x="311" y="542" width="48" height="30" rx="14"/><text x="335" y="557" style="font-size:17px">Turbo</text></g></svg>
